<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1450" viewBox="0 0 1100 1450"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#48635e"/></marker></defs><rect width="1100" height="1450" fill="#fff"/><g font-family="Arial, sans-serif" fill="#183e35"><text x="60" y="46" font-size="29" font-weight="700">TP1 — Du clic « Se connecter » à la bibliothèque</text><text x="60" y="77" font-size="17">Flux du code existant • aucune donnée secrète représentée</text><rect x="190" y="110" width="720" height="88" rx="12" fill="#edf6f4" stroke="#87aaa2"/><text x="208" y="138" font-size="19" font-weight="700">1. Formulaire Angular</text><text x="208" y="162" font-size="15"><tspan x="208" dy="0">login-page.html : (ngSubmit)="submit()"</tspan><tspan x="208" dy="21">Le clic soumet les champs du formulaire.</tspan></text><path d="M550 198 L550 221" fill="none" stroke="#48635e" stroke-width="2" marker-end="url(#arrow)"/><rect x="190" y="224" width="720" height="88" rx="12" fill="#edf6f4" stroke="#87aaa2"/><text x="208" y="252" font-size="19" font-weight="700">2. Composant de connexion</text><text x="208" y="276" font-size="15"><tspan x="208" dy="0">login-page.ts : submit() lit email et password.</tspan><tspan x="208" dy="21">Appelle auth.login(...) et souscrit avec subscribe({ next, error }).</tspan></text><path d="M550 312 L550 335" fill="none" stroke="#48635e" stroke-width="2" marker-end="url(#arrow)"/><rect x="190" y="338" width="720" height="88" rx="12" fill="#edf6f4" stroke="#87aaa2"/><text x="208" y="366" font-size="19" font-weight="700">3. Service et client HTTP</text><text x="208" y="390" font-size="15"><tspan x="208" dy="0">auth.service.ts : AuthService.login() utilise HttpClient.</tspan><tspan x="208" dy="21">POST /api/auth/login — corps JSON : email et password.</tspan></text><path d="M550 426 L550 449" fill="none" stroke="#48635e" stroke-width="2" marker-end="url(#arrow)"/><rect x="190" y="452" width="720" height="88" rx="12" fill="#edf6f4" stroke="#87aaa2"/><text x="208" y="480" font-size="19" font-weight="700">4. Intercepteur d’authentification</text><text x="208" y="504" font-size="15"><tspan x="208" dy="0">auth.interceptor.ts : aucun JWT ajouté à cette route publique.</tspan><tspan x="208" dy="21">La route de connexion est publique : aucun JWT préalable requis.</tspan></text><path d="M550 540 L550 563" fill="none" stroke="#48635e" stroke-width="2" marker-end="url(#arrow)"/><rect x="190" y="566" width="720" height="88" rx="12" fill="#edf6f4" stroke="#87aaa2"/><text x="208" y="594" font-size="19" font-weight="700">5. Proxy de développement Angular</text><text x="208" y="618" font-size="15"><tspan x="208" dy="0">proxy.conf.json : transmet /api du port 4200 au port 3000.</tspan><tspan x="208" dy="21">Le navigateur communique avec l’API via le serveur Angular.</tspan></text><path d="M550 654 L550 677" fill="none" stroke="#48635e" stroke-width="2" marker-end="url(#arrow)"/><rect x="190" y="680" width="720" height="88" rx="12" fill="#edf6f4" stroke="#87aaa2"/><text x="208" y="708" font-size="19" font-weight="700">6. API Express</text><text x="208" y="732" font-size="15"><tspan x="208" dy="0">backend/src/app.js : express.json() lit le corps ; route de login.</tspan><tspan x="208" dy="21">Normalise l’email et recherche l’utilisateur avec le modèle User.</tspan></text><path d="M550 768 L550 791" fill="none" stroke="#48635e" stroke-width="2" marker-end="url(#arrow)"/><rect x="190" y="794" width="720" height="88" rx="12" fill="#edf6f4" stroke="#87aaa2"/><text x="208" y="822" font-size="19" font-weight="700">7. MongoDB et contrôle du mot de passe</text><text x="208" y="846" font-size="15"><tspan x="208" dy="0">Mongoose récupère l’utilisateur et son passwordHash dans MongoDB.</tspan><tspan x="208" dy="21">User.verifyPassword() compare le mot de passe avec bcrypt côté serveur.</tspan></text><path d="M550 882 L550 916" fill="none" stroke="#48635e" stroke-width="2" marker-end="url(#arrow)"/><text x="550" y="943" text-anchor="middle" font-size="21" font-weight="700">Identifiants corrects ?</text><path d="M550 960 L550 979 L295 979 L295 1003 M550 979 L805 979 L805 1003" fill="none" stroke="#48635e" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="1006" width="470" height="88" rx="12" fill="#fff0ed" stroke="#87aaa2"/><text x="78" y="1034" font-size="19" font-weight="700">NON — HTTP 401</text><text x="78" y="1058" font-size="15"><tspan x="78" dy="0">Le backend renvoie un message d’erreur.</tspan><tspan x="78" dy="21">Le callback error du composant reçoit la réponse.</tspan></text><rect x="570" y="1006" width="470" height="88" rx="12" fill="#edf6f4" stroke="#87aaa2"/><text x="588" y="1034" font-size="19" font-weight="700">OUI — HTTP 200</text><text x="588" y="1058" font-size="15"><tspan x="588" dy="0">Le backend signe un JWT (expiration : 2 h).</tspan><tspan x="588" dy="21">Il renvoie { token, user } avec les données publiques.</tspan></text><path d="M295 1094 L295 1123" fill="none" stroke="#48635e" stroke-width="2" marker-end="url(#arrow)"/><path d="M805 1094 L805 1123" fill="none" stroke="#48635e" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="1126" width="470" height="88" rx="12" fill="#fff0ed" stroke="#87aaa2"/><text x="78" y="1154" font-size="19" font-weight="700">Affichage de l’erreur</text><text x="78" y="1178" font-size="15"><tspan x="78" dy="0">Le Signal error est actualisé.</tspan><tspan x="78" dy="21">Le template affiche le message à l’utilisateur.</tspan></text><rect x="570" y="1126" width="470" height="88" rx="12" fill="#edf6f4" stroke="#87aaa2"/><text x="588" y="1154" font-size="19" font-weight="700">8. État Angular mis à jour</text><text x="588" y="1178" font-size="15"><tspan x="588" dy="0">AuthService : tap(...) → storeAuthentication(...).</tspan><tspan x="588" dy="21">Token dans localStorage ; Signals token et currentUser.</tspan></text><path d="M805 1214 L805 1243" fill="none" stroke="#48635e" stroke-width="2" marker-end="url(#arrow)"/><rect x="570" y="1246" width="470" height="88" rx="12" fill="#edf6f4" stroke="#87aaa2"/><text x="588" y="1274" font-size="19" font-weight="700">9. Navigation vers /tracks</text><text x="588" y="1298" font-size="15"><tspan x="588" dy="0">Le callback next déclenche la redirection.</tspan><tspan x="588" dy="21">authGuard autorise la page si le token est présent.</tspan></text><text x="60" y="1385" font-size="18" font-weight="700">Angular → API Express → Mongoose → MongoDB</text><text x="60" y="1415" font-size="16">Le backend vérifie les identifiants ; Angular ne contacte jamais directement MongoDB.</text></g></svg>